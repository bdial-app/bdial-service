name: Deploy Backend

on:
  push:
    branches:
      - develop
      - uat
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set deploy target
        id: vars
        run: |
          if [ "${{ github.ref_name }}" == "production" ]; then
            echo "remote_dir=${{ secrets.SSH_REMOTE_DIR_PROD }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" == "uat" ]; then
            echo "remote_dir=${{ secrets.SSH_REMOTE_DIR_UAT }}" >> $GITHUB_OUTPUT
          else
            echo "remote_dir=${{ secrets.SSH_REMOTE_DIR_DEV }}" >> $GITHUB_OUTPUT
          fi

      - name: Upload dist via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='.env'
          path: dist/
          remote_path: ${{ steps.vars.outputs.remote_dir }}/dist/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Upload package files
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz
          path: package*.json
          remote_path: ${{ steps.vars.outputs.remote_dir }}/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install production deps & restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ steps.vars.outputs.remote_dir }}
            npm install --production --ignore-scripts
            # Restart via Hostinger Node.js manager (touch restart file)
            touch tmp/restart.txt
